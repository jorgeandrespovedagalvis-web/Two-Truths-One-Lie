<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Two Truths & a Lie - Live Classroom</title>
<style>
:root{--bg1:#fff3e3;--bg2:#fdba74;--card:rgba(255,255,255,.65);--accent:#fb923c;--deep:#c2410c;--stop:#dc2626;--ok:#16a34a;--text:#431407;--muted:#9a3412}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,Segoe UI,sans-serif;color:var(--text);background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;justify-content:center;padding:16px}
main{width:100%;max-width:720px}
h1{text-align:center;margin:8px 0 2px;font-size:2.2rem;letter-spacing:2px;color:var(--deep)}
.sub{text-align:center;color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid rgba(194,65,12,.25);border-radius:18px;padding:20px;text-align:center;backdrop-filter:blur(6px);box-shadow:0 8px 24px rgba(194,65,12,.15)}
.code{background:var(--accent);color:var(--text);padding:2px 14px;border-radius:10px;font-weight:800;letter-spacing:4px}
.muted{color:var(--muted);word-break:break-all}
.btn{display:block;width:100%;margin:12px 0 0;padding:14px;border:0;border-radius:12px;font-size:1.05rem;font-weight:700;cursor:pointer;background:var(--accent);color:var(--text)}
.btn.stop{background:var(--stop);color:#fff}
.btn.ghost{background:rgba(255,255,255,.7);color:var(--text)}
.btn:disabled{opacity:.4;cursor:not-allowed}
input[type=text],textarea,select{padding:12px;border-radius:10px;border:2px solid rgba(194,65,12,.3);font:inherit;background:#fff;color:var(--text)}
input[type=text],textarea{width:100%}
select{margin:6px 0}
textarea{resize:none;height:64px}
.row{display:flex;gap:10px;align-items:center;margin:10px 0;text-align:left}
.row label{font-size:.8rem;white-space:nowrap;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.chip{background:rgba(255,255,255,.85);padding:6px 12px;border-radius:20px;border:1px solid rgba(194,65,12,.2)}
.chip.done{background:var(--ok);color:#fff}
.opt{text-align:left;padding:14px;margin:10px 0;border-radius:12px;background:rgba(255,255,255,.75);border:2px solid transparent;font-size:1.05rem;color:var(--text);width:100%;font-family:inherit}
button.opt{cursor:pointer}button.opt:hover{border-color:var(--deep)}
.opt small{float:right;font-weight:700}
.opt.lie{background:var(--stop);color:#fff}.opt.truth{background:rgba(22,163,74,.3)}
.rank{list-style:none;padding:0;text-align:left}
.rank li{display:flex;justify-content:space-between;background:var(--card);margin:6px 0;padding:10px 14px;border-radius:10px}
.rank li:first-child{background:var(--accent);font-weight:800}
.qr{border-radius:12px;background:#fff;padding:8px}
.timer{font-size:3.2rem;font-weight:800;color:var(--deep);margin:6px 0}.timer.low{color:var(--stop)}
.avs{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:8px 0}
.av{font-size:1.5rem;padding:3px 0;border-radius:12px;border:2px solid transparent;background:rgba(255,255,255,.75);cursor:pointer}
.av.sel{border-color:var(--deep);background:var(--accent)}
.hero{width:100%;max-width:420px;display:block;margin:0 auto 6px}
</style>
</head>
<body>
<main>
  <h1>2 TRUTHS &amp; 1 LIE</h1>
  <p class="sub">Live Classroom Game</p>
  <div class="card" id="app">Loading...</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ====== 1) PASTE YOUR SUPABASE VALUES HERE (Project Settings > API) ======
const SUPABASE_URL = 'https://partyseqrlqgdbxehrhf.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhcnR5c2VxcmxxZ2RieGVocmhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxNTEzMTgsImV4cCI6MjEwODcyNzMxOH0.xUIOtYiusPai3gGcO-AVOtpVVVQlOZoyv11zn6uEjRk';
// =========================================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let code = (new URLSearchParams(location.search).get('room') || '').toUpperCase();
let isHost = false, me = null, lastKey = null, busy = false;
let S = {room: null, players: [], stmts: [], votes: []};

const cur = () => S.stmts.find(s => s.id === S.room?.current_statement_id);
const nameOf = id => { const p = S.players.find(x => x.id === id); return p ? (p.avatar || '🙂') + ' ' + p.name : '?'; };
const board = () => '<ol class="rank">' + [...S.players].sort((a, b) => b.score - a.score)
  .map(p => `<li><span>${esc(p.name)}</span><b>${p.score}</b></li>`).join('') + '</ol>';
const chips = showDone => '<div class="chips">' + S.players.map(p =>
  `<span class="chip ${showDone && S.stmts.some(s => s.player_id === p.id) ? 'done' : ''}">${p.avatar || '🙂'} ${esc(p.name)}${showDone && S.stmts.some(s => s.player_id === p.id) ? ' ✓' : ''}</span>`).join('') + '</div>';

// ---------- Entry ----------
(async () => {
  if (!code) return landing();
  const {data} = await sb.from('ttl_rooms').select('code').eq('code', code).maybeSingle();
  if (!data) { app.innerHTML = '<h2>Room not found</h2><button class="btn" onclick="location.search=\'\'">Back</button>'; return; }
  isHost = !!localStorage.getItem('host_' + code);
  me = JSON.parse(localStorage.getItem('p_' + code) || 'null');
  if (!isHost && !me) return joinForm();
  start();
})();

const AVATARS = ['🦊','🐼','🐸','🦄','🐙','🐵','🐯','🐧','🦁','🐶','🐱','🐰','🐻','🦉','🐲','🦖'];
let pickedAv = AVATARS[0];
const hero = () => `<svg class="hero" viewBox="0 0 360 135" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Truth and lie faces">
<ellipse cx="70" cy="20" rx="26" ry="7" fill="none" stroke="#f59e0b" stroke-width="5"/>
<circle cx="70" cy="68" r="42" fill="#fde68a" stroke="#c2410c" stroke-width="3"/>
<circle cx="56" cy="60" r="5" fill="#431407"/><circle cx="84" cy="60" r="5" fill="#431407"/>
<path d="M50 80 Q70 100 90 80" fill="none" stroke="#431407" stroke-width="4" stroke-linecap="round"/>
<circle cx="112" cy="104" r="16" fill="#16a34a"/><path d="M104 104 l6 6 l12 -12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<text x="70" y="131" text-anchor="middle" font-size="15" font-weight="800" fill="#16a34a" font-family="system-ui">TRUTH</text>
<text x="180" y="86" text-anchor="middle" font-size="64" font-weight="800" fill="#fb923c" font-family="system-ui">?</text>
<circle cx="290" cy="68" r="42" fill="#fde68a" stroke="#c2410c" stroke-width="3"/>
<path d="M290 66 L354 74 L290 82 Z" fill="#f97316" stroke="#c2410c" stroke-width="2" stroke-linejoin="round"/>
<circle cx="274" cy="58" r="5" fill="#431407"/><circle cx="302" cy="58" r="5" fill="#431407"/>
<path d="M266 46 l16 5 M310 46 l-16 5" stroke="#431407" stroke-width="3" stroke-linecap="round"/>
<path d="M270 90 Q290 82 308 92" fill="none" stroke="#431407" stroke-width="4" stroke-linecap="round"/>
<circle cx="248" cy="104" r="16" fill="#dc2626"/><path d="M241 97 l14 14 M255 97 l-14 14" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<text x="290" y="131" text-anchor="middle" font-size="15" font-weight="800" fill="#dc2626" font-family="system-ui">LIE</text></svg>`;
function landing() {
  app.innerHTML = hero() + `<p style="font-size:1.8rem;margin:2px">🤥 🎭 🤔 ✅ 🕵️</p><h2>Can you spot the lie?</h2>
  <p class="muted">Two truths and one lie... the class has to guess!</p>
  <button class="btn" onclick="hostGame()">📺 Create room (teacher screen)</button>`;
}
async function hostGame() {
  const c = Math.random().toString(36).slice(2, 6).toUpperCase();
  const {error} = await sb.from('ttl_rooms').insert({code: c});
  if (error) return alert(error.message);
  localStorage.setItem('host_' + c, '1');
  location.search = '?room=' + c;
}
function joinForm() {
  app.innerHTML = hero() + `<h2>Room <span class="code">${esc(code)}</span></h2>
  <input type="text" id="nm" placeholder="Your name" maxlength="30">
  <p class="muted">Pick your avatar</p>
  <div class="avs">${AVATARS.map(a => `<button type="button" class="av ${a === pickedAv ? 'sel' : ''}" onclick="pickAv('${a}')">${a}</button>`).join('')}</div>
  <button class="btn" onclick="join()">Join game</button>`;
}
function pickAv(a) { pickedAv = a; document.querySelectorAll('.av').forEach(b => b.classList.toggle('sel', b.textContent === a)); }
async function join() {
  const name = $('#nm').value.trim();
  if (!name) return alert('Write your name first.');
  const id = crypto.randomUUID();
  const {error} = await sb.from('ttl_players').insert({id, room_code: code, name, avatar: pickedAv});
  if (error) return alert(error.message);
  me = {id, name, avatar: pickedAv};
  localStorage.setItem('p_' + code, JSON.stringify(me));
  start();
}

// ---------- Sync (realtime + polling fallback) ----------
function start() {
  sb.channel('room-' + code).on('postgres_changes', {event: '*', schema: 'public'}, refresh).subscribe();
  setInterval(refresh, 2500); setInterval(tick, 1000);
  sb.rpc('ttl_now').then(r => { if (r.data) off = new Date(r.data).getTime() - Date.now(); });
  refresh();
}
async function refresh() {
  const q = t => sb.from('ttl_' + t).select('*').eq(t === 'rooms' ? 'code' : 'room_code', code);
  const [r, p, s, v] = await Promise.all([q('rooms').maybeSingle(), q('players').order('joined_at'), q('statements').order('created_at'), q('votes')]);
  S = {room: r.data, players: p.data || [], stmts: s.data || [], votes: v.data || []};
  render();
}
function render() {
  if (!S.room) return;
  const key = !isHost && S.room.status === 'writing' && left() > 0 && (!mine() || editing) ? 'form' : null;
  if (key && lastKey === 'form') return; // don't wipe what the player is typing
  lastKey = key;
  app.innerHTML = isHost ? hostView() : playerView();
}

// ---------- Timer & helpers ----------
let off = 0, editing = false, overFor = null, peek = false, dur = 180;
const left = () => S.room?.writing_ends_at ? Math.max(0, Math.round((new Date(S.room.writing_ends_at).getTime() - (Date.now() + off)) / 1000)) : 0;
const fmt = s => s < 60 ? s + 's' : Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
const mine = () => S.stmts.find(s => s.player_id === me?.id);
const timerBox = () => `<div class="timer ${left() <= 10 ? 'low' : ''}" id="timer">${fmt(left())}</div>`;
async function tick() {
  if (!S.room || S.room.status !== 'writing') return;
  const l = left(), el = $('#timer');
  if (el) { el.textContent = fmt(l); el.classList.toggle('low', l <= 10); }
  if (l === 0 && overFor !== S.room.writing_ends_at) {
    overFor = S.room.writing_ends_at;
    if (!isHost && $('#l0')) await submitForm(true);   // auto-send if the form is complete
    lastKey = null; render();
  }
}
const cards = (st, rv, host) => st.lines.map((l, i) => {
  const shown = rv.includes(i), lie = i === st.lie_index;
  return `<div class="opt ${shown ? (lie ? 'lie' : 'truth') : ''}" ${host ? `onclick="flip(${i})" style="cursor:pointer"` : ''}>${i + 1}. ${esc(l)}<small>${shown ? (lie ? '🤥 LIE' : '✅ TRUE') : (host && peek && lie ? '👁 lie' : '')}</small></div>`;
}).join('');

// ---------- Host actions ----------
async function startWriting() { await sb.rpc('ttl_start_writing', {p_code: code, p_secs: dur}); refresh(); }
async function startPresenting() {
  await sb.from('ttl_rooms').update({status: 'voting', current_statement_id: S.stmts[0].id, revealed: []}).eq('code', code); refresh();
}
async function flip(i) {
  const rv = S.room.revealed || [];
  await sb.from('ttl_rooms').update({revealed: rv.includes(i) ? rv.filter(x => x !== i) : [...rv, i]}).eq('code', code); refresh();
}
async function revealAll() { await sb.from('ttl_rooms').update({revealed: [0, 1, 2]}).eq('code', code); refresh(); }
async function next() {
  const n = S.stmts[S.stmts.findIndex(s => s.id === S.room.current_statement_id) + 1];
  await sb.from('ttl_rooms').update(n ? {current_statement_id: n.id, revealed: []} : {status: 'podium'}).eq('code', code); refresh();
}
const togglePeek = () => { peek = !peek; render(); };
async function resetGame() {
  await sb.from('ttl_statements').delete().eq('room_code', code);
  await sb.from('ttl_rooms').update({status: 'lobby', current_statement_id: null, revealed: [], writing_ends_at: null}).eq('code', code);
  refresh();
}

// ---------- Host view ----------
function hostView() {
  const r = S.room, n = S.players.length, st = cur();
  const link = location.origin + location.pathname + '?room=' + code;
  if (r.status === 'lobby') return `<h2>Join with code <span class="code">${code}</span></h2>
    <img class="qr" alt="QR" src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(link)}">
    <p class="muted">${esc(link)}</p><h3>${n} joined</h3>${chips()}
    <p class="muted">Writing time</p>
    <select onchange="dur=+this.value">${[15, 30, 45, 60, 90, 120, 180, 300].map(v => `<option value="${v}" ${v === dur ? 'selected' : ''}>${v % 60 === 0 ? v / 60 + ' min' : v + ' sec'}</option>`).join('')}</select>
    <button class="btn" ${n < 1 ? 'disabled' : ''} onclick="startWriting()">▶ Start writing time</button>`;
  if (r.status === 'writing') { const over = left() === 0; return `<h2>✍️ Students are writing...</h2>${timerBox()}<p>${S.stmts.length}/${n} ready</p>${chips(true)}
    <button class="btn ${over ? 'stop' : ''}" ${S.stmts.length < 1 ? 'disabled' : ''} onclick="startPresenting()">🎭 ${over ? "Time's up! " : ''}Start presenting</button>`; }
  if (r.status === 'podium') return `<h2>🎉 That's a wrap!</h2><p>Thanks for playing</p><button class="btn" onclick="resetGame()">New game (same players)</button>`;
  if (!st) return '<p>Loading...</p>';
  const idx = S.stmts.indexOf(st), last = idx === S.stmts.length - 1;
  return `<p class="muted">${idx + 1} / ${S.stmts.length}</p><h2>${esc(nameOf(st.player_id))}: which one is the lie? 🤔</h2>
    <p class="muted">Click a sentence to reveal it</p>${cards(st, r.revealed || [], true)}
    <button class="btn" onclick="revealAll()">🎉 Reveal all</button>
    <button class="btn stop" onclick="next()">${last ? 'Finish 🏁' : 'Next student ➡'}</button>
    <button class="btn ghost" onclick="togglePeek()">👁 Teacher peek: ${peek ? 'ON' : 'OFF'}</button>`;
}

// ---------- Player ----------
async function submitForm(silent) {
  const lines = [0, 1, 2].map(i => $('#l' + i)?.value.trim() || ''), lie = document.querySelector('input[name=lie]:checked');
  if (lines.some(l => l.length < 3) || !lie) { if (!silent) alert('Write all three statements and mark the lie.'); return; }
  if (!silent && left() === 0) return alert("Time's up!");
  const {error} = await sb.from('ttl_statements').upsert({room_code: code, player_id: me.id, lines, lie_index: +lie.value}, {onConflict: 'room_code,player_id'});
  if (error) { if (!silent) alert(error.message); return; }
  editing = false; lastKey = null; await refresh();
}
const startEdit = () => { editing = true; lastKey = null; render(); };
function playerView() {
  const r = S.room, st = cur(), head = `<p class="muted">Room ${code} · ${me.avatar || '🙂'} ${esc(me.name)}</p>`;
  if (r.status === 'lobby') return head + '<h2>You\'re in! 🎉</h2><p>Waiting for the host to start...</p>' + chips();
  if (r.status === 'writing') {
    const m = mine(), l = left();
    if (m && !editing) return head + `<h2>Submitted ✓</h2>${timerBox()}<p>Waiting for the others...</p>` + (l > 0 ? '<button class="btn ghost" onclick="startEdit()">✏️ Edit my sentences</button>' : '');
    if (l === 0) return head + '<h2>⏰ Time\'s up!</h2><p>Look at the big screen.</p>';
    return head + `<h2>Write 2 truths &amp; 1 lie</h2>${timerBox()}` + [0, 1, 2].map(i => `<div class="row"><textarea id="l${i}" maxlength="140" placeholder="Statement ${i + 1}">${m ? esc(m.lines[i]) : ''}</textarea>
      <label><input type="radio" name="lie" value="${i}" ${m && m.lie_index === i ? 'checked' : ''}> the lie</label></div>`).join('') +
      '<button class="btn" onclick="submitForm()">Send</button>';
  }
  if (r.status === 'podium') return head + '<h2>🎉 That\'s a wrap!</h2><p>Thanks for playing!</p>';
  if (!st) return head + '<p>Loading...</p>';
  return head + `<h2>${st.player_id === me.id ? '🎤 It\'s your turn! Convince the class!' : esc(nameOf(st.player_id)) + ': which one is the lie? 🤔'}</h2>` + cards(st, r.revealed || [], false);
}
</script>
</body>
</html>
